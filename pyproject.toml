# FILE MAP
#   1-30  Project metadata, dependencies, pytest and ruff config for the Python half (agent + evals).

[project]
name = "triagebench"
version = "0.1.0"
description = "GitHub issue-triage agent with a backtested eval suite built from real maintainer actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# The agent half. Week 2 uses only the MCP client; Pydantic AI joins in Week 3.
agent = ["mcp>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: needs the built MCP server (npm run build in mcp-server/)"]

[tool.ruff]
line-length = 100
target-version = "py311"
